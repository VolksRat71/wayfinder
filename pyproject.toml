[project]
name = "wayfinder"
version = "0.2.0"
description = "Retrieve and insert for notes and repos, with an eval that picks the method from your own history"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
embed = ["transformers>=4.40", "torch>=2.2"]
laya = ["laya>=0.4"]
dev = ["pytest>=8"]

[project.scripts]
wayfinder = "wayfinder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wayfinder"]
